[package]
name        = "hdpassw"
version     = "0.2.0"
edition     = "2024"
description = "Deterministic password manager backed by a BIP39 seed phrase"
license     = "BSD-2-Clause"
repository  = "https://github.com/whitepiratesmith/hdpassw"
keywords    = ["password", "bip39", "deterministic", "security"]
categories  = ["command-line-utilities", "cryptography"]

[[bin]]
name = "hdpassw"
path = "src/main.rs"

[[bin]]
name = "hdpassw-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[lib]
name = "hdpassw"
path = "src/lib.rs"

[features]
gui = ["eframe", "egui"]

[dependencies]
# Cryptography
bip39            = "2"
scrypt           = "0.11"
blake3           = "1"
zeroize          = { version = "1", features = ["derive"] }
secrecy          = "0.8"
argon2           = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hex              = "0.4"

# CLI
clap        = { version = "4", features = ["derive", "color", "env"] }
rand        = "0.8"

# Storage
serde       = { version = "1", features = ["derive"] }
toml        = "0.8"

# UX
rpassword   = "7"
arboard     = "3"
dirs        = "5"

# Utilities
thiserror   = "1"
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
serde_json  = "1"

# GUI (optional, behind "gui" feature)
eframe      = { version = "0.32", optional = true }
egui        = { version = "0.32", optional = true }

[target.'cfg(unix)'.dependencies]
libc        = "0.2"

[profile.release]
strip     = true
opt-level = "z"
lto       = true
